name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (check & build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test — ${{ matrix.platform }})
    # Lantenna ships for macOS and Linux, and each OS has code the other never
    # compiles (`#[cfg(target_os = ...)]`: the AppKit accent colors on macOS;
    # the ICMP flag dialect and the `ip neigh` ARP reader on Linux) — so lint
    # and test on both real targets.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # Tauri v2 needs the webkit2gtk 4.1 series (and friends) to compile on
      # Linux; macOS runners have everything out of the box.
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # src-tauri embeds the built frontend via `generate_context!`, so the
      # `build/` directory must exist before any cargo command touches it.
      - name: Build frontend (required by tauri::generate_context!)
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      # The crate lives in src-tauri/ (there is no root Cargo.toml), so every
      # cargo command must run from there.
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri
