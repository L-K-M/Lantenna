name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (check & build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    # Lantenna is a macOS-only app: it links against AppKit (objc2-app-kit) for
    # system accent colors and only bundles a .dmg. The macOS-gated code paths
    # (`#[cfg(target_os = "macos")]`) only compile on macOS, so we lint and test
    # on a macOS runner to exercise the real target rather than on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # src-tauri embeds the built frontend via `generate_context!`, so the
      # `build/` directory must exist before any cargo command touches it.
      - name: Build frontend (required by tauri::generate_context!)
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
