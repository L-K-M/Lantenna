name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PRs, never an in-progress main run: a permanently
# "cancelled" main commit masks breakage and breaks CI bisection.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (check & build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test — ${{ matrix.platform }})
    # Lantenna ships for macOS and Linux, and each OS has code the other never
    # compiles (`#[cfg(target_os = ...)]`: the AppKit accent colors on macOS;
    # the ICMP flag dialect and the `ip neigh` ARP reader on Linux) — so lint
    # and test on both real targets.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    # A cache-miss cold build with the Tauri system deps can take half an hour;
    # a wedged one must not burn six.
    timeout-minutes: 60
    # The crate lives in src-tauri/, not the repo root. Without this every cargo
    # step fails with "could not find `Cargo.toml`".
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 needs the webkit2gtk 4.1 series (and friends) to compile on
      # Linux; macOS runners have everything out of the box.
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # src-tauri embeds the built frontend via `generate_context!`, so the
      # `build/` directory must exist before any cargo command touches it.
      - name: Build frontend (required by tauri::generate_context!)
        working-directory: .
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
